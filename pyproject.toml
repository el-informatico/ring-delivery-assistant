[project]
name = "ring-delivery-assistant"
version = "0.1.0"
description = "Intent and routing layer for Ring-style doorbell event streams - offline-first, stdlib-only core"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
demo = "ring_assistant.demo:main"
generate = "ring_assistant.synth:main"

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # TestClient (in-process, no network) exercises the optional FastAPI adapter:
    "fastapi>=0.115",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ring_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
